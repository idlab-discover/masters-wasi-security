# default-mode: defines how default values are chosen
# default-mode: [allow, deny]
default-mode: allow

packages:
  wasi:io:
    interfaces: 
      error:
        resources:
          error:
            allow: true
      poll:
        resources:
          pollable:
            allow: true
            functions:
              block:
                allow: true
                # these are just examples to explain the syntax of the arguments field, they do not reflect the actual arguments of the block function in the pollable interface
                arguments:
                  # - type:  the type of the argument (only primitive types are supported for now)
                    # values: the values to block/allow for this argument
                    # allow: whether to block or allow the specified values for this argument when this function is called
                    ### when a arg is passed of which the value is not defined in the values field, the opposite of the allow field is applied
                  - type: bool
                    values: [true]
                    allow: false # the first arg is a bool an is not allowed to be true when this function is called
                  - type: s32
                    values: [10,20,30] # the second arg is an i32 and is only allowed to be 10,20 or 30 when this function is called
                    allow: true # the second arg is an i32 and is allowed to be 10,20 or 30 when this function is called
                  - type: string
                    values: ["hello","world"] 
                    allow: true # the third arg is a string and is allowed to be "hello" or "world" when this function is called
                  - type: s32
                    values: [] # no values to block/allow
                    allow: false # the fourth arg is an i32 and any value is allowed when this function is called
                  # if there are more arguments defined in the function signature than in the arguments field, all arguments are allowed

      streams:
        resources:
          input-stream:
            functions:
              read:
                allow: true
              subscribe:
                allow: true
          output-stream:
            allow: true # since allow is defined as true functions in this resource are allowed
            # functions:
            #   blocking-write-and-flush:
            #     allow: false
            #   write:
            #     allow: false # but this overwrites the higher level allow
  wasi:cli:
    # allow: false # this overwrites the default allow for all functions in this package
    interfaces:
      stdin:
        allow: true # this overwrites the deny for all functions in this package
      stdout:
        allow: true
    


