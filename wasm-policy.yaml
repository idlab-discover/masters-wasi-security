# default-mode: defines how default values are chosen
# default-mode: [allow, deny]
default-mode: allow

packages:
  wasi:io:
    interfaces: 
      error:
        resources:
          error:
            allow: true
      poll:
        resources:
          pollable:
            allow: true
            functions:
              block:
                allow: true
                # Each argument constraint uses the WIT type name as the key,
                # with the list of values to allow or block.
                # The "allow" field controls whether the listed values are
                # allowed (true) or blocked (false).
                # When a value is passed that is NOT in the values list,
                # the opposite of "allow" applies.
                arguments:
                  - allow: false
                    bool: [true]        # arg 0: bool, block value 'true'
                  - allow: true
                    s32: [10, 20, 30]   # arg 1: s32, only allow 10/20/30
                  - allow: true
                    string: ["hello", "world"]  # arg 2: string, only allow these
                  - allow: false
                    s32: []             # arg 3: s32, no values blocked → all allowed
                  # if there are more arguments in the function signature
                  # than in this list, all extra arguments are unconstrained

      streams:
        resources:
          input-stream:
            functions:
              read:
                allow: true
              subscribe:
                allow: true
          output-stream:
            allow: true # since allow is defined as true functions in this resource are allowed
            # functions:
            #   blocking-write-and-flush:
            #     allow: false
            #   write:
            #     allow: false # but this overwrites the higher level allow
  wasi:cli:
    # allow: false # this overwrites the default allow for all functions in this package
    interfaces:
      stdin:
        allow: true # this overwrites the deny for all functions in this package
      stdout:
        allow: true
  wasi:sockets:
    interfaces:
      tcp:
        resources:
          tcp-socket:
            functions:
              set-keep-alive-enabled:
                allow: true
                arguments:
                  - allow: false
                    bool: [false]   # arg 0: bool, block value 'true'
