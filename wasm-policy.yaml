# default-mode: defines how default values are chosen
# default-mode: [allow, deny]
default-mode: allow

# behaviour-overwrite: defines if something else needs to happen when blocked / allowed (handy for debugging)
# behaviour-overwrite: [none(default), complain]
# complain: (writes to stdout after program execution) which function calls would've been blocked, without stopping execution.
# create mode is available through CLI with --wasm-policy-create.
behaviour-overwrite: complain 

packages:
  wasi:io:
    interfaces: 
      error:
        resources:
          error:
            allow: true
      poll:
        resources:
          pollable:
            allow: true
            functions:
              block:
                allow: true
                # Each argument constraint uses the WIT type name as the key,
                # with the list of values to allow or block.
                # The "mode" field controls how the constraints are enforced
                # (allow-list, block-list, or no-constraint).
                arguments:
                  0:
                    mode: block-list
                    bool: [true]        # arg 0: bool, block value 'true'
                  1:
                    mode: allow-list
                    s32: [10, 20, 30]   # arg 1: s32, only allow 10/20/30
                  2:
                    mode: allow-list
                    string: ["hello", "world"]  # arg 2: string, only allow these
                  # arg 3 is missing, so it has no constraint and is fully allowed
                  # if there are more arguments in the function signature
                  # than in this list, all extra arguments are unconstrained

      streams:
        resources:
          input-stream:
            functions:
              read:
                allow: true
              subscribe:
                allow: true
          output-stream:
            allow: true # since allow is defined as true functions in this resource are allowed
            # functions:
            #   blocking-write-and-flush:
            #     allow: false
            #   write:
            #     allow: false # this overwrites the higher level allow
  wasi:cli:
    # allow: false # this overwrites the default allow for all functions in this package
    interfaces:
      stdin:
        allow: true # this overwrites the deny for all functions in this package
      stdout:
        allow: true
  wasi:sockets:
    interfaces:
      tcp:
        resources:
          tcp-socket:
            functions:
              set-keep-alive-enabled:
                allow: true
                arguments:
                  0:
                    mode: block-list
                    bool: [false]   # arg 0: bool, block value 'false'
                    # string: ["hello", "world"]  # arg 2: string, only allow these
